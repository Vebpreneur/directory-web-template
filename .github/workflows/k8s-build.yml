name: k8s-build
on:
  workflow_dispatch:
  push:
    branches: [develop, stage, main, master]
concurrency:
  group: k8s-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # REPO-AGNOSTIC on purpose. `suffix` (not a literal image name) is what
        # keeps this file correct after the platform force-pushes it verbatim
        # into every Work repo — the image is always the repo's OWN package,
        # which is the only one that repo's GITHUB_TOKEN can write.
        include:
          - suffix: ''
            dockerfile: Dockerfile
            context: .
          - suffix: '-docs'
            dockerfile: apps/docs/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: t
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            stage) echo "tag=stage" >> "$GITHUB_OUTPUT" ;;
            main|master) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT" ;;
          esac
      # Not every repo generated from this template carries apps/docs, so the
      # `-docs` matrix leg must skip cleanly rather than fail the workflow.
      - id: present
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ matrix.dockerfile }} in this repo — skipping this image."
          fi
      - uses: docker/build-push-action@v7
        if: steps.present.outputs.found == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Route the in-image dependency install through the internal Verdaccio
          # cache. The Dockerfile already accepts this build-arg and falls back to
          # public npm when it is empty (forks, GitHub-hosted builds), so this is
          # additive. Integrity hashes are still verified by pnpm.
          #
          # DOCS_URL / DOCS_HOME_CANONICAL_PATH: the docs image's canonical origin and the page
          # its site root redirects to (apps/docs/docusaurus.config.ts). They belong to the
          # REPOSITORY, so they come from its variables; a Work repo without DOCS_URL builds a
          # noindex docs image that names no host. The literal fallbacks apply to the template
          # repository itself only (its docs.demo.ever.works ingress redirects / to
          # /getting-started/) and evaluate to '' in every repo generated from it. The root
          # Dockerfile declares neither arg and ignores them.
          build-args: |
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            DOCS_URL=${{ vars.DOCS_URL || (github.repository == 'ever-works/directory-web-template' && 'https://docs.demo.ever.works' || '') }}
            DOCS_HOME_CANONICAL_PATH=${{ vars.DOCS_HOME_CANONICAL_PATH || (github.repository == 'ever-works/directory-web-template' && '/getting-started/' || '') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.suffix }}:${{ steps.t.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.suffix }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.suffix }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.suffix }}:buildcache,mode=max
